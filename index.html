        * {

            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: #ffffff;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(125, 211, 252, 0.3);
        }

        .author-info {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .author-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: linear-gradient(135deg, #0ea5e9, #38bdf8);
            color: white;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 500;
        }

        .author-name {
            font-size: 1.1em;
            color: #334155;
            font-weight: 500;
        }

        .author-name span {
            color: #0284c7;
            font-weight: bold;
        }

        .showcase {
            background: #ffffff;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(125, 211, 252, 0.3);
        }

        .showcase-title {
            text-align: center;
            margin-bottom: 25px;
        }

        .showcase-title h2 {
            font-size: 1.8em;
            background: linear-gradient(135deg, #0ea5e9 0%, #0369a1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .showcase-title p {
            color: #64748b;
            margin-top: 8px;
        }

        .showcase-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .showcase-video {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #0f172a;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(14, 165, 233, 0.2);
        }

        .showcase-video video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .showcase-image {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .showcase-image img {
            width: 100%;
            border-radius: 16px;
            object-fit: cover;
            box-shadow: 0 8px 25px rgba(14, 165, 233, 0.2);
        }

        .showcase-features {
            display: flex;
            justify-content: space-around;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px dashed #bae6fd;
        }

        .feature-item {
            text-align: center;
        }

        .feature-icon {
            font-size: 2em;
            margin-bottom: 5px;
        }

        .feature-text {
            color: #475569;
            font-weight: 500;
        }

        header h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, #0ea5e9 0%, #0369a1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        header p {
            color: #475569;
            font-size: 1.1em;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 15px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            background: linear-gradient(135deg, #0ea5e9 0%, #0369a1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            color: #64748b;
            font-size: 0.9em;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .project-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 6px 30px rgba(14, 165, 233, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(125, 211, 252, 0.25);
        }

        .project-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #0ea5e9, #38bdf8);
        }

        .project-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(14, 165, 233, 0.18);
        }

        .project-image {
            width: 100%;
            height: 180px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #7dd3fc, #38bdf8);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .project-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .project-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            background: linear-gradient(135deg, #7dd3fc, #38bdf8);
        }

        .project-card h3 {
            font-size: 1.3em;
            color: #1e293b;
            margin-bottom: 10px;
        }

        .project-card p {
            color: #64748b;
            font-size: 0.95em;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .project-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }

        .tag {
            padding: 4px 12px;
            background: #e0f2fe;
            color: #0369a1;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 500;
        }

        .project-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 10px 15px;
            border: none;
            border-radius: 10px;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0ea5e9, #38bdf8);
            color: white;
        }

        .btn-secondary {
            background: #f472b6;
            color: white;
        }

        .btn:hover {
            transform: scale(1.03);
            box-shadow: 0 5px 15px rgba(14, 165, 233, 0.2);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #ffffff;
            border-radius: 20px;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 25px;
            background: linear-gradient(135deg, #0ea5e9, #38bdf8);
            color: white;
        }

        .modal-header h2 {
            font-size: 1.3em;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.3em;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.35);
        }

        .modal-body {
            padding: 25px;
            max-height: calc(90vh - 80px);
            overflow-y: auto;
            background: #f8fafc;
        }

            width: 100%;
            padding-bottom: 56.25%;
            background: #0f172a;
            border-radius: 12px;

        }

            text-decoration: none;

        }

            display: inline-block;
            margin-left: 5px;
            color: #64748b;
        }

            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 10px;
        }

            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.3s;
            border: 1px solid #e2e8f0;
        }

        .image-gallery img:hover {
            transform: scale(1.05);
        }

            text-align: center;
            padding: 30px;
            color: #64748b;
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }
            .projects-grid {
                grid-template-columns: 1fr;
            }
            .stats {
                gap: 20px;
            }
            .showcase-content {
                grid-template-columns: 1fr;
            }
            .showcase-features {
                flex-wrap: wrap;
                gap: 15px;
            }

    </style>
</head>

                images: ['projects/串口开关灯系统/预览图2.png'],
                links: []
            },
            {
                title: '交通流水灯',
                icon: '🚦',
                description: '基于嵌入式编程实现的交通信号灯控制系统，展示定时器与GPIO编程技巧。',
                tags: ['嵌入式', 'GPIO', '定时器'],
                video: 'projects/编程实现交通流水灯/编程实现交通流水灯.mp4',
                images: [],
                links: []
            },
            {
                title: '按键控制板载灯',
                icon: '⌨️',
                description: '通过按键输入实现串口数据的读取与发送，锻炼嵌入式输入输出编程能力。',
                tags: ['按键', '串口', '输入输出'],
                video: 'projects/按键控制板载灯/按键控制板载灯.mp4',
                images: [],
                links: []
            },
            {
                title: '按键控制网页灯',
                icon: '⌨️',
                description: '通过按键输入实现串口数据的读取与发送，锻炼嵌入式输入输出编程能力。',
                tags: ['按键', '串口', '输入输出'],
                video: 'projects/按键开网页灯/按键开网页灯.mp4',
                images: [],
                links: []
            }
        ];

        function renderProjects() {
            const grid = document.getElementById('projectsGrid');
            grid.innerHTML = projects.map((p, i) => {
                const hasImage = p.images && p.images.length > 0;
                const coverImage = hasImage ? p.images[0] : null;
                return `
                <div class="project-card" onclick="openModal(${i})">
                    ${coverImage ? `
                        <div class="project-image">
                            <img src="${coverImage}" alt="${p.title}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                            <div class="project-placeholder" style="display:none">${p.icon}</div>
                        </div>
                    ` : `
                        <div class="project-image">
                            <div class="project-placeholder">${p.icon}</div>
                        </div>
                    `}
                    <h3>${p.title}</h3>
                    <p>${p.description}</p>
                    <div class="project-tags">
                        ${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}
                    </div>
                    <div class="project-actions">
                        ${(p.video && p.video.endsWith('.mp4')) ? '<button class="btn btn-primary">▶ 观看视频</button>' : ''}
                        ${p.links.length > 0 ? '<button class="btn btn-secondary">🔗 访问链接</button>' : ''}
                    </div>
                </div>
            `}).join('');
            document.getElementById('projectCount').textContent = projects.length;
        }

        function openModal(index) {
            const p = projects[index];
            document.getElementById('modalTitle').textContent = p.title;
            let content = '';
            if (p.video && p.video.endsWith('.mp4')) {
                content += `<div class="video-container"><video controls><source src="${p.video}" type="video/mp4"></video></div>`;
            }
            if (p.images && p.images.length > 0) {
                content += `
                <div class="info-section">
                    <h3>🖼️ 项目截图</h3>
                    <div class="image-gallery">
                        ${p.images.map(img => `<img src="${img}" onclick="window.open('${img}','_blank')">`).join('')}
                    </div>
                </div>`;
            }
            content += `
            <div class="info-section"><h3>📖 项目简介</h3><p>${p.description}</p></div>
            <div class="info-section">
                <h3>🏷️ 技术标签</h3>
                <div class="project-tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
            </div>`;
            if (p.links.length > 0) {
                content += `
                <div class="info-section">
                    <h3>🔗 相关链接</h3>
                    <ul class="link-list">
                        ${p.links.map(l => `<li><a href="${l}" target="_blank">${l}</a><span class="external-link">↗</span></li>`).join('')}
                    </ul>
                </div>`;
            }
            document.getElementById('modalBody').innerHTML = content;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            document.querySelectorAll('video').forEach(v => v.pause());
        }

        document.getElementById('modal').addEventListener('click', e => {
            if (e.target.id === 'modal') closeModal();
        });
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeModal();
        });
        renderProjects();
    </script>
</body>
</html>
